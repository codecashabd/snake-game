<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        #gameCanvas {
            border: 4px solid #333;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to bottom, #87CEEB 0%, #555 100%);
            display: block;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .score-box, .coins-box, .distance-box {
            background: rgba(0, 0, 0, 0.7);
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: 3px solid #FFD700;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-screen.hidden, .game-over-screen.hidden {
            display: none;
        }

        h1 {
            color: #FFD700;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn {
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            color: #000;
            border: 4px solid #FF8C00;
            padding: 15px 40px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            margin: 10px;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #FFD700;
        }

        .instructions {
            color: white;
            font-size: 1.2em;
            margin-top: 20px;
            text-align: center;
        }

        .final-score {
            color: #FFD700;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="score-box">Score: <span id="score">0</span></div>
            <div class="coins-box">🪙 <span id="coins">0</span></div>
            <div class="distance-box">Distance: <span id="distance">0</span>m</div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="start-screen" id="startScreen">
            <h1>🏃 STREET RUNNER 🏃</h1>
            <button class="btn" onclick="startGame()">START GAME</button>
            <div class="instructions">
                ⬅️ ➡️ Arrow Keys to Move<br>
                ⬆️ Space to Jump<br>
                Avoid Obstacles • Collect Coins
            </div>
        </div>

        <div class="game-over-screen hidden" id="gameOverScreen">
            <h1>GAME OVER!</h1>
            <div class="final-score">
                Final Score: <span id="finalScore">0</span><br>
                Coins: <span id="finalCoins">0</span> 🪙
            </div>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>

        <div class="controls">
            ⬅️ ➡️ Move | SPACE Jump
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameRunning = false;
        let score = 0;
        let coins = 0;
        let distance = 0;
        let gameSpeed = 5;
        let obstacleTimer = 0;
        let coinTimer = 0;

        // Player
        const player = {
            x: 1, // 0 = left, 1 = middle, 2 = right
            y: 400,
            targetY: 400,
            width: 40,
            height: 60,
            jumping: false,
            jumpSpeed: 0,
            gravity: 1.2
        };

        const lanes = [250, 380, 510]; // X positions for 3 lanes
        const obstacles = [];
        const coinsList = [];
        const buildings = [];

        // Initialize buildings for background
        for (let i = 0; i < 10; i++) {
            buildings.push({
                x: Math.random() * canvas.width,
                y: 50 + Math.random() * 100,
                width: 60 + Math.random() * 40,
                height: 100 + Math.random() * 100,
                speed: 0.5 + Math.random() * 0.5,
                color: `hsl(${Math.random() * 60 + 200}, 50%, ${40 + Math.random() * 20}%)`
            });
        }

        class Obstacle {
            constructor() {
                this.lane = Math.floor(Math.random() * 3);
                this.x = lanes[this.lane];
                this.y = -100;
                this.width = 50;
                this.height = 60;
                this.speed = gameSpeed;
                this.type = Math.random() > 0.5 ? 'box' : 'barrier';
                this.color = this.type === 'box' ? '#8B4513' : '#FF4444';
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(this.x - this.width/2 + 5, this.y + this.height + 5, this.width, 10);

                if (this.type === 'box') {
                    // Box obstacle
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                    
                    // Details
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x - this.width/2, this.y, this.width, this.height);
                    
                    ctx.strokeStyle = '#A0522D';
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.width/2, this.y + this.height/2);
                    ctx.lineTo(this.x + this.width/2, this.y + this.height/2);
                    ctx.stroke();
                } else {
                    // Barrier obstacle
                    ctx.fillStyle = '#FF4444';
                    ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                    
                    // Stripes
                    ctx.fillStyle = '#FFFFFF';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(this.x - this.width/2, this.y + i * 20, this.width, 10);
                    }
                    
                    ctx.strokeStyle = '#CC0000';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x - this.width/2, this.y, this.width, this.height);
                }
                
                ctx.restore();
            }

            isOffScreen() {
                return this.y > canvas.height + 100;
            }
        }

        class Coin {
            constructor() {
                this.lane = Math.floor(Math.random() * 3);
                this.x = lanes[this.lane];
                this.y = -50;
                this.radius = 15;
                this.speed = gameSpeed;
                this.rotation = 0;
            }

            update() {
                this.y += this.speed;
                this.rotation += 0.1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Coin
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#FFD700');
                gradient.addColorStop(0.7, '#FFA500');
                gradient.addColorStop(1, '#FF8C00');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = '#FF8C00';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(-5, -5, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            isOffScreen() {
                return this.y > canvas.height + 50;
            }
        }

        function drawBackground() {
            // Sky
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, 300);

            // Buildings (parallax)
            buildings.forEach(building => {
                ctx.fillStyle = building.color;
                ctx.fillRect(building.x, building.y, building.width, building.height);
                
                // Windows
                ctx.fillStyle = 'rgba(255, 255, 200, 0.8)';
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 4; j++) {
                        ctx.fillRect(
                            building.x + 10 + i * 15,
                            building.y + 10 + j * 20,
                            10, 15
                        );
                    }
                }

                building.y += building.speed;
                if (building.y > canvas.height) {
                    building.y = -building.height;
                    building.x = Math.random() * canvas.width;
                }
            });

            // Road
            const roadGradient = ctx.createLinearGradient(200, 0, 600, 0);
            roadGradient.addColorStop(0, '#555');
            roadGradient.addColorStop(0.5, '#666');
            roadGradient.addColorStop(1, '#555');
            ctx.fillStyle = roadGradient;
            
            // Perspective road
            ctx.beginPath();
            ctx.moveTo(200, 0);
            ctx.lineTo(0, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(600, 0);
            ctx.closePath();
            ctx.fill();

            // Road lines
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            
            for (let i = 0; i < 2; i++) {
                const x = 300 + i * 200;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(150 + i * 500, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Sidewalks
            ctx.fillStyle = '#888';
            ctx.fillRect(0, 300, 200, canvas.height);
            ctx.fillRect(600, 300, 200, canvas.height);
        }

        function drawPlayer() {
            const targetX = lanes[player.x];
            const currentX = player.x === 1 ? 380 : (player.x === 0 ? 250 : 510);
            
            ctx.save();
            
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(targetX, 460, 25, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#3B82F6';
            ctx.fillRect(targetX - player.width/2, player.y, player.width, player.height);
            
            // Head
            ctx.fillStyle = '#FDB76C';
            ctx.beginPath();
            ctx.arc(targetX, player.y - 10, 20, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(targetX - 8, player.y - 12, 3, 0, Math.PI * 2);
            ctx.arc(targetX + 8, player.y - 12, 3, 0, Math.PI * 2);
            ctx.fill();

            // Arms
            ctx.strokeStyle = '#FDB76C';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(targetX - player.width/2, player.y + 15);
            ctx.lineTo(targetX - player.width/2 - 15, player.y + 30);
            ctx.moveTo(targetX + player.width/2, player.y + 15);
            ctx.lineTo(targetX + player.width/2 + 15, player.y + 30);
            ctx.stroke();

            // Legs
            ctx.strokeStyle = '#1E40AF';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(targetX - 10, player.y + player.height);
            ctx.lineTo(targetX - 10, player.y + player.height + 20);
            ctx.moveTo(targetX + 10, player.y + player.height);
            ctx.lineTo(targetX + 10, player.y + player.height + 20);
            ctx.stroke();

            ctx.restore();
        }

        function updatePlayer() {
            // Jumping
            if (player.jumping) {
                player.jumpSpeed += player.gravity;
                player.y += player.jumpSpeed;

                if (player.y >= player.targetY) {
                    player.y = player.targetY;
                    player.jumping = false;
                    player.jumpSpeed = 0;
                }
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width/2 &&
                   obj1.x + obj1.width/2 > obj2.x - obj2.width/2 &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function checkCoinCollision(player, coin) {
            const playerX = lanes[player.x];
            const dist = Math.sqrt(
                Math.pow(playerX - coin.x, 2) + 
                Math.pow(player.y + player.height/2 - coin.y, 2)
            );
            return dist < player.width/2 + coin.radius;
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            
            // Update distance and score
            distance += 0.1;
            score = Math.floor(distance);
            document.getElementById('score').textContent = score;
            document.getElementById('distance').textContent = Math.floor(distance);

            // Increase difficulty
            if (score % 100 === 0 && score > 0) {
                gameSpeed += 0.5;
            }

            // Spawn obstacles
            obstacleTimer++;
            if (obstacleTimer > 60 - gameSpeed * 2) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
            }

            // Spawn coins
            coinTimer++;
            if (coinTimer > 40) {
                coinsList.push(new Coin());
                coinTimer = 0;
            }

            // Update and draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                const playerX = lanes[player.x];
                const collision = Math.abs(playerX - obstacles[i].x) < 40 &&
                                  player.y + player.height > obstacles[i].y &&
                                  player.y < obstacles[i].y + obstacles[i].height;

                if (collision && !player.jumping) {
                    gameOver();
                }

                if (obstacles[i].isOffScreen()) {
                    obstacles.splice(i, 1);
                }
            }

            // Update and draw coins
            for (let i = coinsList.length - 1; i >= 0; i--) {
                coinsList[i].update();
                coinsList[i].draw();

                if (checkCoinCollision(player, coinsList[i])) {
                    coins++;
                    score += 10;
                    document.getElementById('coins').textContent = coins;
                    coinsList.splice(i, 1);
                    continue;
                }

                if (coinsList[i].isOffScreen()) {
                    coinsList.splice(i, 1);
                }
            }

            updatePlayer();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameRunning = true;
            score = 0;
            coins = 0;
            distance = 0;
            gameSpeed = 5;
            obstacles.length = 0;
            coinsList.length = 0;
            player.x = 1;
            player.y = 400;
            player.jumping = false;
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCoins').textContent = coins;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if (e.key === 'ArrowLeft' && player.x > 0) {
                player.x--;
            } else if (e.key === 'ArrowRight' && player.x < 2) {
                player.x++;
            } else if (e.key === ' ' && !player.jumping) {
                e.preventDefault();
                player.jumping = true;
                player.jumpSpeed = -18;
            }
        });

        // Initial draw
        drawBackground();
        drawPlayer();
    </script>
</body>
</html>
