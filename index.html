<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snooker Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: white;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            color: white;
            font-size: 18px;
            gap: 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
        }

        #gameCanvas {
            border: 8px solid #8B4513;
            background: linear-gradient(to bottom, #0B6623 0%, #0a5a1f 100%);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            cursor: crosshair;
        }

        .controls {
            margin-top: 15px;
            color: white;
            font-size: 14px;
        }

        .power-bar-container {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .power-bar {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .power-fill {
            height: 100%;
            background: linear-gradient(to right, #4ade80, #fbbf24, #ef4444);
            width: 0%;
            transition: width 0.05s;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .message {
            color: #fbbf24;
            font-size: 18px;
            margin-top: 10px;
            min-height: 25px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎱 Snooker Game 🎱</h1>
        <div class="info-bar">
            <div class="info-item">Player: <span id="player">1</span></div>
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Balls Left: <span id="ballsLeft">15</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="power-bar-container">
            <div style="color: white; margin-bottom: 5px; font-size: 14px;">Shot Power</div>
            <div class="power-bar">
                <div class="power-fill" id="powerFill"></div>
            </div>
        </div>
        <div class="controls">
            🎯 Click and drag on white ball to aim • Release to shoot
        </div>
        <div>
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="message" id="message">Player 1's turn</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const playerElement = document.getElementById('player');
        const ballsLeftElement = document.getElementById('ballsLeft');
        const messageElement = document.getElementById('message');
        const powerFill = document.getElementById('powerFill');

        let balls = [];
        let cueBall;
        let isDragging = false;
        let dragStart = {x: 0, y: 0};
        let aimLine = {x: 0, y: 0};
        let currentPlayer = 1;
        let scores = [0, 0];
        let ballsPotted = 0;
        let canShoot = true;

        const FRICTION = 0.98;
        const BALL_RADIUS = 12;
        const POCKET_RADIUS = 20;

        const pockets = [
            {x: 20, y: 20},
            {x: canvas.width / 2, y: 10},
            {x: canvas.width - 20, y: 20},
            {x: 20, y: canvas.height - 20},
            {x: canvas.width / 2, y: canvas.height - 10},
            {x: canvas.width - 20, y: canvas.height - 20}
        ];

        class Ball {
            constructor(x, y, color, isCue = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.color = color;
                this.isCue = isCue;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // Stop if moving very slowly
                if (Math.abs(this.vx) < 0.05) this.vx = 0;
                if (Math.abs(this.vy) < 0.05) this.vy = 0;

                // Wall collision
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                    this.vx *= -0.8;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) {
                    this.vy *= -0.8;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                }

                // Check pocket collision
                pockets.forEach(pocket => {
                    const dx = this.x - pocket.x;
                    const dy = this.y - pocket.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < POCKET_RADIUS) {
                        if (this.isCue) {
                            // Cue ball potted - foul
                            this.active = false;
                            messageElement.textContent = "Foul! Cue ball potted!";
                            setTimeout(() => {
                                this.active = true;
                                this.x = 200;
                                this.y = canvas.height / 2;
                                this.vx = 0;
                                this.vy = 0;
                                switchPlayer();
                            }, 1500);
                        } else {
                            // Colored ball potted
                            this.active = false;
                            ballsPotted++;
                            scores[currentPlayer - 1] += 10;
                            updateScore();
                            messageElement.textContent = "Ball potted! +10 points";
                        }
                    }
                });
            }

            draw() {
                if (!this.active) return;

                ctx.save();
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x + 2, this.y + 2, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ball
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius / 3,
                    this.y - this.radius / 3,
                    this.radius / 4,
                    this.x,
                    this.y,
                    this.radius
                );
                
                if (this.isCue) {
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(1, '#e0e0e0');
                } else {
                    const lightColor = lightenColor(this.color, 40);
                    gradient.addColorStop(0, lightColor);
                    gradient.addColorStop(1, this.color);
                }
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x - this.radius / 3, this.y - this.radius / 3, this.radius / 3, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            isMoving() {
                return Math.abs(this.vx) > 0 || Math.abs(this.vy) > 0;
            }
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        }

        function initBalls() {
            balls = [];
            ballsPotted = 0;

            // Cue ball
            cueBall = new Ball(200, canvas.height / 2, '#ffffff', true);
            balls.push(cueBall);

            // Rack the balls in triangle formation
            const startX = 600;
            const startY = canvas.height / 2;
            const spacing = BALL_RADIUS * 2 + 2;
            
            const colors = ['#dc2626', '#eab308', '#16a34a', '#8b5cf6', '#f97316', 
                           '#06b6d4', '#ec4899', '#6366f1', '#84cc16', '#f59e0b',
                           '#10b981', '#ef4444', '#3b82f6', '#a855f7', '#14b8a6'];

            let colorIndex = 0;
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col <= row; col++) {
                    const x = startX + row * spacing * 0.866;
                    const y = startY - (row * spacing / 2) + col * spacing;
                    balls.push(new Ball(x, y, colors[colorIndex % colors.length]));
                    colorIndex++;
                }
            }
        }

        function checkCollisions() {
            for (let i = 0; i < balls.length; i++) {
                if (!balls[i].active) continue;
                
                for (let j = i + 1; j < balls.length; j++) {
                    if (!balls[j].active) continue;
                    
                    const dx = balls[j].x - balls[i].x;
                    const dy = balls[j].y - balls[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < balls[i].radius + balls[j].radius) {
                        // Collision detected
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        // Rotate velocities
                        const vx1 = balls[i].vx * cos + balls[i].vy * sin;
                        const vy1 = balls[i].vy * cos - balls[i].vx * sin;
                        const vx2 = balls[j].vx * cos + balls[j].vy * sin;
                        const vy2 = balls[j].vy * cos - balls[j].vx * sin;

                        // Swap velocities (elastic collision)
                        const temp = vx1;
                        const newVx1 = vx2;
                        const newVx2 = temp;

                        // Rotate back
                        balls[i].vx = newVx1 * cos - vy1 * sin;
                        balls[i].vy = vy1 * cos + newVx1 * sin;
                        balls[j].vx = newVx2 * cos - vy2 * sin;
                        balls[j].vy = vy2 * cos + newVx2 * sin;

                        // Separate balls
                        const overlap = balls[i].radius + balls[j].radius - dist;
                        const separateX = overlap * cos / 2;
                        const separateY = overlap * sin / 2;

                        balls[i].x -= separateX;
                        balls[i].y -= separateY;
                        balls[j].x += separateX;
                        balls[j].y += separateY;
                    }
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0B6623';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw table pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw pockets
            pockets.forEach(pocket => {
                const gradient = ctx.createRadialGradient(pocket.x, pocket.y, 0, pocket.x, pocket.y, POCKET_RADIUS);
                gradient.addColorStop(0, '#000000');
                gradient.addColorStop(1, '#1a1a1a');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(pocket.x, pocket.y, POCKET_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

            // Update and draw balls
            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });

            checkCollisions();

            // Draw aim line
            if (isDragging && canShoot) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(aimLine.x, aimLine.y);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw power indicator
                const power = Math.min(
                    Math.sqrt(
                        Math.pow(aimLine.x - cueBall.x, 2) + 
                        Math.pow(aimLine.y - cueBall.y, 2)
                    ) / 2,
                    100
                );
                powerFill.style.width = power + '%';
            }

            // Check if all balls stopped
            const allStopped = balls.every(ball => !ball.active || !ball.isMoving());
            if (allStopped && !canShoot) {
                canShoot = true;
                
                // Check win condition
                if (ballsPotted >= 15) {
                    messageElement.textContent = `Player ${currentPlayer} wins! 🎉`;
                }
            }

            requestAnimationFrame(draw);
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            playerElement.textContent = currentPlayer;
            messageElement.textContent = `Player ${currentPlayer}'s turn`;
        }

        function updateScore() {
            scoreElement.textContent = scores[currentPlayer - 1];
            ballsLeftElement.textContent = 15 - ballsPotted;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!canShoot) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - cueBall.x;
            const dy = y - cueBall.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cueBall.radius + 10) {
                isDragging = true;
                dragStart = {x, y};
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const rect = canvas.getBoundingClientRect();
            aimLine.x = e.clientX - rect.left;
            aimLine.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDragging || !canShoot) return;

            const dx = aimLine.x - cueBall.x;
            const dy = aimLine.y - cueBall.y;
            const power = Math.sqrt(dx * dx + dy * dy) / 15;

            cueBall.vx = -dx * power * 0.1;
            cueBall.vy = -dy * power * 0.1;

            isDragging = false;
            canShoot = false;
            powerFill.style.width = '0%';
            
            setTimeout(() => {
                const ballsMoving = balls.some(ball => ball.active && ball.isMoving());
                if (!ballsMoving) {
                    const oldScore = scores[currentPlayer - 1];
                    setTimeout(() => {
                        if (scores[currentPlayer - 1] === oldScore && ballsPotted < 15) {
                            switchPlayer();
                        }
                    }, 1000);
                }
            }, 1000);
        });

        function resetGame() {
            currentPlayer = 1;
            scores = [0, 0];
            initBalls();
            updateScore();
            playerElement.textContent = currentPlayer;
            messageElement.textContent = "Player 1's turn";
            canShoot = true;
            powerFill.style.width = '0%';
        }

        // Initialize and start
        initBalls();
        draw();
    </script>
</body>
</html>
