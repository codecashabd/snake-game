<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chess Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .turn-indicator {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 3px solid #333;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.selected {
            background-color: #7fc97f !important;
        }

        .square.valid-move {
            background-color: #a8d5a8 !important;
        }

        .square:hover {
            opacity: 0.8;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #5568d3;
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #e74c3c;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>♔ Chess Game ♚</h1>
        <div class="turn-indicator" id="turnIndicator">White's Turn</div>
        <div id="chessboard"></div>
        <div class="controls">
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        const board = document.getElementById('chessboard');
        const turnIndicator = document.getElementById('turnIndicator');
        const messageElement = document.getElementById('message');

        let currentTurn = 'white';
        let selectedSquare = null;
        let gameBoard = [];

        // Unicode chess pieces
        const pieces = {
            white: {
                king: '♔',
                queen: '♕',
                rook: '♖',
                bishop: '♗',
                knight: '♘',
                pawn: '♙'
            },
            black: {
                king: '♚',
                queen: '♛',
                rook: '♜',
                bishop: '♝',
                knight: '♞',
                pawn: '♟'
            }
        };

        // Initialize board
        function initBoard() {
            gameBoard = [
                ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
                ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
                ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
            ];
        }

        // Get piece color
        function getPieceColor(piece) {
            if (!piece) return null;
            const whitePieces = Object.values(pieces.white);
            return whitePieces.includes(piece) ? 'white' : 'black';
        }

        // Get piece type
        function getPieceType(piece) {
            for (let color in pieces) {
                for (let type in pieces[color]) {
                    if (pieces[color][type] === piece) {
                        return type;
                    }
                }
            }
            return null;
        }

        // Check if move is valid
        function isValidMove(fromRow, fromCol, toRow, toCol) {
            const piece = gameBoard[fromRow][fromCol];
            const targetPiece = gameBoard[toRow][toCol];
            const pieceColor = getPieceColor(piece);
            const targetColor = getPieceColor(targetPiece);
            const pieceType = getPieceType(piece);

            // Can't capture own piece
            if (targetColor === pieceColor) return false;

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            switch(pieceType) {
                case 'pawn':
                    const direction = pieceColor === 'white' ? -1 : 1;
                    const startRow = pieceColor === 'white' ? 6 : 1;
                    
                    // Move forward
                    if (fromCol === toCol && !targetPiece) {
                        if (toRow === fromRow + direction) return true;
                        if (fromRow === startRow && toRow === fromRow + 2 * direction && !gameBoard[fromRow + direction][fromCol]) return true;
                    }
                    // Capture diagonally
                    if (colDiff === 1 && toRow === fromRow + direction && targetPiece) return true;
                    return false;

                case 'rook':
                    if (fromRow === toRow || fromCol === toCol) {
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'knight':
                    return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);

                case 'bishop':
                    if (rowDiff === colDiff) {
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'queen':
                    if (fromRow === toRow || fromCol === toCol || rowDiff === colDiff) {
                        return isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'king':
                    return rowDiff <= 1 && colDiff <= 1;

                default:
                    return false;
            }
        }

        // Check if path is clear (for rook, bishop, queen)
        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
            const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
            
            let currentRow = fromRow + rowStep;
            let currentCol = fromCol + colStep;

            while (currentRow !== toRow || currentCol !== toCol) {
                if (gameBoard[currentRow][currentCol]) return false;
                currentRow += rowStep;
                currentCol += colStep;
            }
            return true;
        }

        // Get all valid moves for selected piece
        function getValidMoves(row, col) {
            const validMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (isValidMove(row, col, r, c)) {
                        validMoves.push({row: r, col: c});
                    }
                }
            }
            return validMoves;
        }

        // Render board
        function renderBoard() {
            board.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.className += (row + col) % 2 === 0 ? ' light' : ' dark';
                    square.textContent = gameBoard[row][col];
                    square.dataset.row = row;
                    square.dataset.col = col;
                    
                    square.addEventListener('click', handleSquareClick);
                    
                    board.appendChild(square);
                }
            }
        }

        // Handle square click
        function handleSquareClick(e) {
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const clickedPiece = gameBoard[row][col];
            const pieceColor = getPieceColor(clickedPiece);

            // If no piece is selected
            if (!selectedSquare) {
                if (clickedPiece && pieceColor === currentTurn) {
                    selectedSquare = {row, col};
                    highlightSquare(row, col);
                    highlightValidMoves(row, col);
                    messageElement.textContent = '';
                }
            } else {
                // If same square clicked, deselect
                if (selectedSquare.row === row && selectedSquare.col === col) {
                    selectedSquare = null;
                    renderBoard();
                    return;
                }

                // Try to move
                if (isValidMove(selectedSquare.row, selectedSquare.col, row, col)) {
                    // Make the move
                    const capturedPiece = gameBoard[row][col];
                    gameBoard[row][col] = gameBoard[selectedSquare.row][selectedSquare.col];
                    gameBoard[selectedSquare.row][selectedSquare.col] = '';
                    
                    // Check if king was captured
                    if (capturedPiece === '♔' || capturedPiece === '♚') {
                        messageElement.textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)} wins!`;
                        renderBoard();
                        return;
                    }

                    // Switch turn
                    currentTurn = currentTurn === 'white' ? 'black' : 'white';
                    turnIndicator.textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)}'s Turn`;
                    selectedSquare = null;
                    renderBoard();
                } else {
                    // Invalid move, try selecting new piece
                    if (clickedPiece && pieceColor === currentTurn) {
                        selectedSquare = {row, col};
                        renderBoard();
                        highlightSquare(row, col);
                        highlightValidMoves(row, col);
                    } else {
                        messageElement.textContent = 'Invalid move!';
                        setTimeout(() => messageElement.textContent = '', 2000);
                    }
                }
            }
        }

        // Highlight selected square
        function highlightSquare(row, col) {
            const squares = document.querySelectorAll('.square');
            const index = row * 8 + col;
            squares[index].classList.add('selected');
        }

        // Highlight valid moves
        function highlightValidMoves(row, col) {
            const validMoves = getValidMoves(row, col);
            const squares = document.querySelectorAll('.square');
            
            validMoves.forEach(move => {
                const index = move.row * 8 + move.col;
                squares[index].classList.add('valid-move');
            });
        }

        // Reset game
        function resetGame() {
            currentTurn = 'white';
            selectedSquare = null;
            messageElement.textContent = '';
            turnIndicator.textContent = "White's Turn";
            initBoard();
            renderBoard();
        }

        // Initialize game
        initBoard();
        renderBoard();
    </script>
</body>
</html>
