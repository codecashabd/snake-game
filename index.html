<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DON'T TURN AROUND</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        #startScreen {
            background: #000;
        }

        #startScreen h1 {
            font-size: 4em;
            color: #8B0000;
            text-shadow: 0 0 20px #ff0000;
            animation: flicker 3s infinite;
            margin-bottom: 30px;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            93% { opacity: 0.2; }
            95% { opacity: 1; }
        }

        .btn {
            background: #1a0000;
            color: #8B0000;
            border: 2px solid #8B0000;
            padding: 20px 50px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            background: #8B0000;
            color: #000;
            box-shadow: 0 0 30px #8B0000;
        }

        #warning {
            color: #666;
            margin-top: 20px;
            font-size: 0.8em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        #gameScreen {
            background: #0a0a0a;
            position: relative;
        }

        #corridor {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1000px;
            background: 
                radial-gradient(ellipse at center, #1a1a1a 0%, #000 70%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(50, 50, 50, 0.1) 50px,
                    rgba(50, 50, 50, 0.1) 100px
                );
        }

        #staticNoise {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" /></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.5"/></svg>');
            animation: static 0.1s infinite;
            pointer-events: none;
        }

        @keyframes static {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2%, 2%); }
            40% { transform: translate(-2%, -2%); }
            60% { transform: translate(2%, -2%); }
            80% { transform: translate(2%, 2%); }
            100% { transform: translate(0, 0); }
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8B0000;
            font-size: 2em;
            text-align: center;
            text-shadow: 0 0 10px #ff0000;
            animation: messageGlow 2s infinite;
            z-index: 100;
        }

        @keyframes messageGlow {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 10px #ff0000; }
            50% { opacity: 1; text-shadow: 0 0 30px #ff0000; }
        }

        #counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #8B0000;
            font-size: 3em;
            text-shadow: 0 0 20px #ff0000;
            z-index: 100;
        }

        .ghost {
            position: absolute;
            font-size: 8em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            text-shadow: 0 0 50px #000;
        }

        #jumpscare {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 1000;
        }

        #jumpscare.active {
            display: flex;
            animation: scareShake 0.1s infinite;
        }

        @keyframes scareShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 10px) rotate(-2deg); }
            50% { transform: translate(10px, -10px) rotate(2deg); }
            75% { transform: translate(-10px, -10px) rotate(-1deg); }
        }

        #jumpscare img {
            font-size: 20em;
            animation: scareZoom 0.5s;
        }

        @keyframes scareZoom {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .eyes {
            position: absolute;
            display: flex;
            gap: 40px;
            opacity: 0;
            animation: eyesFade 3s ease-in-out;
        }

        @keyframes eyesFade {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.8; }
        }

        .eye {
            width: 30px;
            height: 30px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 40px #ff0000;
        }

        #shadow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0;
            background: linear-gradient(to top, #000, transparent);
            transition: height 2s;
        }

        .whisper {
            position: absolute;
            color: rgba(139, 0, 0, 0.5);
            font-size: 1.2em;
            opacity: 0;
            animation: whisperFloat 4s forwards;
            pointer-events: none;
        }

        @keyframes whisperFloat {
            0% { opacity: 0; transform: translateY(0); }
            50% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        #heartbeat {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(139, 0, 0, 0);
            pointer-events: none;
            animation: heartbeatPulse 2s infinite;
        }

        @keyframes heartbeatPulse {
            0%, 100% { background: rgba(139, 0, 0, 0); }
            10% { background: rgba(139, 0, 0, 0.1); }
            20% { background: rgba(139, 0, 0, 0); }
            30% { background: rgba(139, 0, 0, 0.15); }
            40% { background: rgba(139, 0, 0, 0); }
        }

        .glitch {
            animation: glitchEffect 5s infinite;
        }

        @keyframes glitchEffect {
            0%, 98% { transform: translate(0); }
            98.5% { transform: translate(-10px, 5px); clip-path: inset(0 0 50% 0); }
            99% { transform: translate(10px, -5px); clip-path: inset(50% 0 0 0); }
            99.5% { transform: translate(0); clip-path: none; }
        }
    </style>
</head>
<body>
    <div id="cursor"></div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <h1>DON'T TURN AROUND</h1>
        <button class="btn" onclick="startGame()">ENTER</button>
        <div id="warning">⚠️ Warning: Contains jump scares and disturbing content ⚠️</div>
        <div id="warning" style="margin-top: 10px;">🔊 Use headphones for best experience 🔊</div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div id="corridor">
            <div id="staticNoise"></div>
            <div id="heartbeat"></div>
            <div id="shadow"></div>
            <div id="counter">60</div>
            <div id="message">Find the exit...<br><span style="font-size: 0.5em;">Click anywhere to survive</span></div>
        </div>
        <div id="jumpscare"></div>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const corridor = document.getElementById('corridor');
        const message = document.getElementById('message');
        const counter = document.getElementById('counter');
        const jumpscare = document.getElementById('jumpscare');
        const shadow = document.getElementById('shadow');
        const heartbeat = document.getElementById('heartbeat');

        let gameActive = false;
        let timeLeft = 60;
        let clicks = 0;
        let clicksNeeded = 50;
        let scareTimer;
        let whisperTimer;
        let ghostTimer;

        const scaryMessages = [
            "I can see you...",
            "Don't look behind you...",
            "It's getting closer...",
            "You can't escape...",
            "I'm right behind you...",
            "Why are you running?",
            "You're not alone...",
            "Can you hear the footsteps?",
            "It's watching you...",
            "Turn around...",
            "The exit doesn't exist...",
            "You shouldn't have come here..."
        ];

        const whispers = [
            "help me...",
            "run...",
            "it's here...",
            "behind you...",
            "leave...",
            "too late..."
        ];

        // Custom cursor follow
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function startGame() {
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            gameActive = true;
            
            startTimer();
            startScareEvents();
            startWhispers();
            spawnGhosts();
            increaseDarkness();
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timerInterval);
                    return;
                }
                
                timeLeft--;
                counter.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    counter.style.animation = 'scareShake 0.2s infinite';
                    heartbeat.style.animationDuration = '0.8s';
                }
                
                if (timeLeft <= 0) {
                    triggerJumpscare('☠️', 'TIME IS UP...');
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function startScareEvents() {
            scareTimer = setInterval(() => {
                if (!gameActive) return;
                
                const randomMessage = scaryMessages[Math.floor(Math.random() * scaryMessages.length)];
                message.textContent = randomMessage;
                message.style.fontSize = Math.random() * 2 + 1.5 + 'em';
                
                // Random screen glitch
                if (Math.random() < 0.3) {
                    corridor.classList.add('glitch');
                    setTimeout(() => corridor.classList.remove('glitch'), 200);
                }
                
                // Random eye appearance
                if (Math.random() < 0.2) {
                    showEyes();
                }
            }, 3000);
        }

        function startWhispers() {
            whisperTimer = setInterval(() => {
                if (!gameActive) return;
                
                const whisper = document.createElement('div');
                whisper.className = 'whisper';
                whisper.textContent = whispers[Math.floor(Math.random() * whispers.length)];
                whisper.style.left = Math.random() * 80 + 10 + '%';
                whisper.style.top = Math.random() * 80 + 10 + '%';
                corridor.appendChild(whisper);
                
                setTimeout(() => whisper.remove(), 4000);
            }, 5000);
        }

        function spawnGhosts() {
            ghostTimer = setInterval(() => {
                if (!gameActive) return;
                
                const ghost = document.createElement('div');
                ghost.className = 'ghost';
                ghost.textContent = ['👻', '💀', '☠️', '👹'][Math.floor(Math.random() * 4)];
                ghost.style.left = Math.random() * 80 + 10 + '%';
                ghost.style.top = Math.random() * 80 + 10 + '%';
                corridor.appendChild(ghost);
                
                setTimeout(() => {
                    ghost.style.opacity = '0.7';
                    setTimeout(() => {
                        ghost.style.opacity = '0';
                        setTimeout(() => ghost.remove(), 300);
                    }, 500);
                }, 100);
                
                // Random jump scare chance
                if (Math.random() < 0.15 && clicks < clicksNeeded / 2) {
                    setTimeout(() => {
                        if (gameActive) {
                            triggerJumpscare('👹', 'I FOUND YOU!!!');
                        }
                    }, 2000);
                }
            }, 4000);
        }

        function showEyes() {
            const eyes = document.createElement('div');
            eyes.className = 'eyes';
            eyes.innerHTML = '<div class="eye"></div><div class="eye"></div>';
            eyes.style.left = Math.random() * 70 + 15 + '%';
            eyes.style.top = Math.random() * 50 + 10 + '%';
            corridor.appendChild(eyes);
            
            setTimeout(() => eyes.remove(), 3000);
        }

        function increaseDarkness() {
            let darkness = 0;
            setInterval(() => {
                if (!gameActive) return;
                darkness += 5;
                shadow.style.height = Math.min(darkness, 80) + '%';
            }, 5000);
        }

        corridor.addEventListener('click', (e) => {
            if (!gameActive) return;
            
            clicks++;
            
            // Create click effect
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = '#8B0000';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'pulse 0.5s forwards';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
            
            message.textContent = `Keep clicking... ${clicks}/${clicksNeeded}`;
            
            // Tension increase
            if (clicks > 20 && clicks < 30) {
                message.textContent = "IT'S GETTING CLOSER...";
            }
            
            if (clicks > 35 && clicks < 45) {
                message.textContent = "YOU CAN'T ESCAPE!!!";
                corridor.style.animation = 'scareShake 0.5s';
                setTimeout(() => corridor.style.animation = '', 500);
            }
            
            if (clicks >= clicksNeeded) {
                winGame();
            }
        });

        function triggerJumpscare(emoji, text) {
            gameActive = false;
            jumpscare.classList.add('active');
            jumpscare.innerHTML = `<div style="font-size: 20em;">${emoji}</div>`;
            jumpscare.style.background = '#000';
            
            // Create scream text
            setTimeout(() => {
                const scream = document.createElement('div');
                scream.style.position = 'absolute';
                scream.style.fontSize = '5em';
                scream.style.color = '#ff0000';
                scream.style.textShadow = '0 0 50px #ff0000';
                scream.style.animation = 'scareShake 0.1s infinite';
                scream.textContent = text;
                jumpscare.appendChild(scream);
            }, 500);
            
            setTimeout(() => {
                location.reload();
            }, 3000);
        }

        function winGame() {
            gameActive = false;
            clearInterval(scareTimer);
            clearInterval(whisperTimer);
            clearInterval(ghostTimer);
            
            message.innerHTML = `
                <div style="font-size: 2em; color: #00ff00; text-shadow: 0 0 20px #00ff00;">
                    YOU ESCAPED...<br>
                    <span style="font-size: 0.3em; color: #8B0000; margin-top: 20px;">
                        ...or did you?
                    </span>
                </div>
            `;
            
            // Fake ending - jump scare after "winning"
            setTimeout(() => {
                triggerJumpscare('😈', 'YOU THOUGHT YOU WON?!');
            }, 2000);
        }

        // Random screen shake
        setInterval(() => {
            if (gameActive && Math.random() < 0.1) {
                document.body.style.animation = 'scareShake 0.2s';
                setTimeout(() => document.body.style.animation = '', 200);
            }
        }, 5000);
    </script>
</body>
</html>
